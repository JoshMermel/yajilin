<!DOCTYPE html>
<!-- The picture behind og-image.png (what a link to the game looks like in iMessage, WhatsApp, Slack): a solved board drawn by the app's own
     Board class next to the name. Made into a PNG by tools/make_social_images.mjs; open it over HTTP to look at it (npm run serve, then
     /tools/social_card.html?book=8x8&puzzle=1). -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Yajilin social card</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #1976d2; color: #fff; display: flex; align-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { display: flex; align-items: center; gap: 64px; padding: 0 80px; width: 100%; box-sizing: border-box; }
    #board { flex: none; width: 470px; margin: 0; padding: 22px; background: #fff; border-radius: 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
    h1 { font-size: 132px; line-height: 1; margin: 0 0 22px; letter-spacing: -2px; }
    p { font-size: 38px; line-height: 1.3; margin: 0; opacity: 0.92; }
    .url { margin-top: 34px; font-size: 28px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <div id="board"></div>
    <div>
      <h1>Yajilin</h1>
      <p>The loop-and-arrow puzzle, with thousands of puzzles and hints that explain the logic.</p>
      <p class="url">joshmermelstein.com/yajilin</p>
    </div>
  </div>
  <script type="module">
    import { parseCsv, compile, decodeSolution, SHADED, LOOP, E_ON } from '../js/logic.js';
    import { clueStates } from '../js/clues.js';
    import { Board } from '../js/board.js';

    const q = new URLSearchParams(location.search);
    const book = q.get('book') || '8x8', n = +(q.get('puzzle') || 1);
    const P = compile(parseCsv(await (await fetch(`../data/${book}.csv`)).text())[n - 1]);
    const sol = decodeSolution(P, P.solution);
    const marks = { cells: new Uint8Array(P.N), edges: new Uint8Array(P.numEdges), auto: new Uint8Array(P.N) };
    for (let i = 0; i < P.N; i++) marks.cells[i] = sol.cell[i] === SHADED ? 1 : sol.cell[i] === LOOP ? 2 : 0;
    for (let x = 0; x < P.numEdges; x++) marks.edges[x] = sol.e[x] === E_ON ? 1 : 0;
    const board = new Board(document.getElementById('board'), {});
    board.setPuzzle(P);
    board.render(marks, { clueState: clueStates(P, marks), badShaded: new Set() });
    document.title = 'ready';
  </script>
</body>
</html>
